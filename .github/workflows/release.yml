name: Release

on:
    workflow_dispatch:
        inputs:
            bump:
                description: Version bump to apply
                type: choice
                options:
                    - patch
                    - minor
                    - major
                default: patch
    push:
        tags:
            - "quarry-alpha*"
            - "v*"

permissions:
    contents: write

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    version:
        if: ${{ github.event_name == 'workflow_dispatch' }}
        runs-on: ubuntu-latest
        outputs:
            tag: ${{ steps.bump.outputs.tag }}
            version: ${{ steps.bump.outputs.version }}
        steps:
            - name: Checkout default branch
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.repository.default_branch }}
                  fetch-depth: 0

            - name: Setup bun
              uses: oven-sh/setup-bun@v2

            - name: Bump version, commit and tag
              id: bump
              shell: bash
              run: |
                  set -euo pipefail
                  version="$(bun scripts/bump-version.ts ${{ inputs.bump }} | tail -n1)"
                  tag="v${version}"
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
                  git commit -m "chore(release): v${version}"
                  git push origin "HEAD:${{ github.event.repository.default_branch }}"
                  git tag "${tag}"
                  git push origin "${tag}"
                  echo "tag=${tag}" >> "$GITHUB_OUTPUT"
                  echo "version=${version}" >> "$GITHUB_OUTPUT"

    build:
        needs: [version]
        if: ${{ !cancelled() && !failure() }}
        strategy:
            fail-fast: false
            # One platform at a time. `tauri-action` checks for the release, then
            # creates it when missing — and with the matrix in parallel every job
            # races that check (measured on desktop-v0.6.3: Linux created the
            # release, Windows hit the gap and failed, and the still-queued macOS job
            # was cancelled with the run, leaving a Linux-only release). Serialising
            # costs minutes and makes each job see what the previous one created.
            max-parallel: 1
            matrix:
                include:
                    - platform: macos-latest
                      args: "--target universal-apple-darwin"
                      rustTargets: "aarch64-apple-darwin,x86_64-apple-darwin"
                    - platform: ubuntu-22.04
                      args: ""
                      rustTargets: ""
                    - platform: windows-latest
                      args: ""
                      rustTargets: ""
        runs-on: ${{ matrix.platform }}
        steps:
            - name: Checkout release tag
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.version.outputs.tag || github.ref_name }}

            - name: Install Linux dependencies
              if: ${{ matrix.platform == 'ubuntu-22.04' }}
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

            - name: Setup bun
              uses: oven-sh/setup-bun@v2

            - name: Setup Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.rustTargets }}

            - name: Cache cargo
              uses: swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri

            - name: Install frontend dependencies
              run: bun install --frozen-lockfile

            - name: Resolve and verify the release version
              id: release
              shell: bash
              env:
                  TAG: ${{ needs.version.outputs.tag || github.ref_name }}
              run: |
                  set -euo pipefail
                  got="$(node -p "require('./src-tauri/tauri.conf.json').version")"
                  # Alpha tags carry the counter, not the version: `quarry-alpha3` must ship
                  # `X.Y.Z-alpha.3`. A stable tag carries the whole version: `vX.Y.Z`.
                  case "$TAG" in
                    quarry-alpha*)
                      counter="${TAG#quarry-alpha}"
                      case "$got" in
                        *-alpha."$counter") ;;
                        *)
                          echo "tag '$TAG' expects version '*-alpha.$counter', tauri.conf.json has '$got'" >&2
                          exit 1
                          ;;
                      esac
                      ;;
                    v*)
                      if [ "${TAG#v}" != "$got" ]; then
                        echo "tag version '${TAG#v}' does not match tauri.conf.json version '$got'" >&2
                        exit 1
                      fi
                      ;;
                    *)
                      echo "unrecognised tag '$TAG': use quarry-alpha<N> or v<version>" >&2
                      exit 1
                      ;;
                  esac
                  echo "version=${got}" >> "$GITHUB_OUTPUT"

            - name: Build and release
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # Updater signing. `bundle.createUpdaterArtifacts` is on, so the
                  # bundler only emits the `.tar.gz`/`.zip` + `.sig` pair and the
                  # updater `latest.json` when these are present. The repo secrets
                  # hold the private key content and its password — never print or
                  # commit either, and never rotate the key: the public key baked
                  # into shipped binaries is what verifies the download, so a new
                  # keypair orphans every installed app.
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
                  # Tauri's dmg bundler runs a Finder AppleScript to prettify the window,
                  # which hangs/fails without a GUI+Automation session. `CI` makes it skip
                  # that step. Runners export CI=true already; pinned here so the release
                  # never depends on that default.
                  CI: "true"
              with:
                  tauriScript: bun run tauri
                  tagName: ${{ needs.version.outputs.tag || github.ref_name }}
                  releaseName: quarry ${{ steps.release.outputs.version }}
                  releaseBody: |
                      quarry is a Rust and C/C++ IDE built on Tauri 2. It bundles clangd, rust-analyzer and lldb-dap to do the real work, and ships for macOS, Windows and Linux.

                      **macOS**: open the `.dmg`, drag the app into `/Applications`, then clear the download quarantine flag. These builds are unsigned and not notarized, so Gatekeeper will block the first launch:

                      ```sh
                      xattr -dr com.apple.quarantine /Applications/quarry.app
                      ```

                      Add `sudo` if it reports a permission error, and change the path if the app is installed elsewhere.

                      **Windows**: run the `-setup.exe` (or the `.msi`). These builds are unsigned, so SmartScreen may warn: choose **More info → Run anyway**.
                      **Linux**: install the `.deb` / `.rpm`, or `chmod +x` the `.AppImage` and run it.
                      The app updates itself from the `latest.json` attached to this release page.
                  releaseDraft: false
                  prerelease: false
                  args: ${{ matrix.args }}
