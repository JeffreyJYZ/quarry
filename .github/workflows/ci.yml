name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    ci:
        name: ci
        runs-on: macos-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1"

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy, rustfmt

            - name: Cache Rust
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri

            - name: Install cargo-nextest
              uses: taiki-e/install-action@v2
              with:
                  tool: nextest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # One script runs the whole gate: types, formatting, lint, frontend tests, then
            # cargo fmt, check, test and clippy. Running the same command here and locally is the
            # point — a check that only exists in CI drifts from the one that gates a commit.
            # Smoke scripts (scripts/*-smoke.ts) are intentionally omitted: they need rust-analyzer
            # and lldb-dap on PATH and would be flaky in CI.
            - name: Gate
              run: bun run gate

            - name: Build
              run: bun run build

    # The LSP and debugger probes are a separate job: they need toolchains the gate does not, and
    # a hung language server should not hold the gate job hostage. `bun scripts/integration.ts`
    # exits non-zero only when a probe that ran fails; probes whose tool is missing are SKIPPED and
    # probes marked manualOnly (they need DevToolsSecurity) are never run, so this job never asks
    # for sudo and never enables the debugger permission.
    integration:
        name: integration
        runs-on: macos-latest
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1"

            # The runner image carries Xcode and Homebrew, so `clang`, `clangd`, `lldb-dap`,
            # `cmake` and `ninja` are already present; rust-analyzer is the one tool to install.
            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rust-analyzer

            - name: Cache Rust
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # A missing toolchain should name itself here, in one line per tool, rather than
            # surfacing later as a probe that "failed".
            - name: Detect tools
              run: bun scripts/detect-tools.ts

            - name: Integration probes
              run: bun scripts/integration.ts
