name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    ci:
        name: ci
        runs-on: macos-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1"

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy, rustfmt

            - name: Cache Rust
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # One script runs the whole gate: types, formatting, lint, frontend tests, then
            # cargo fmt, check, test and clippy. Running the same command here and locally is the
            # point — a check that only exists in CI drifts from the one that gates a commit.
            # Smoke scripts (scripts/*-smoke.ts) are intentionally omitted: they need rust-analyzer
            # and lldb-dap on PATH and would be flaky in CI.
            - name: Gate
              run: bun run gate

            - name: Build
              run: bun run build
